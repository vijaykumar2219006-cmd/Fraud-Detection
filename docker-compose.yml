# docker compose up --build
#   dashboard -> http://localhost:8501
#   REST API  -> http://localhost:8000/docs
services:
  dashboard:
    build: .
    image: transfraud
    ports:
      - "8501:8501"
  api:
    image: transfraud
    depends_on:
      - dashboard
    command: ["uvicorn", "api:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
